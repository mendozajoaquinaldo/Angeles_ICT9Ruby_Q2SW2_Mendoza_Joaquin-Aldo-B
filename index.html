<!DOCTYPE html>
<html>
<head>
    <title>Q2 Seatwork 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-image: url('bg.jpg');
            background-size: cover;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark px-3">
        <a class="navbar-brand" href="#">
            <img src="logo.png" height="40"> Contact Us
        </a>

        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </nav>

    <div class="container mt-5">
        <div class="row">
            
            <div class="col-md-6">
                <h2 class="bg-light text-center p-2">School Office Hours</h2>
                <table class="table table-bordered table-striped bg-light text-center">
                    <thead class="table-primary">
                        <tr>
                            <th>Day</th>
                            <th>Office Hours</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Monday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Registrar's Office</td>
                        </tr>
                        <tr>
                            <td>Tuesday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Accounting Office</td>
                        </tr>
                        <tr>
                            <td>Wednesday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Guidance Office</td>
                        </tr>
                        <tr>
                            <td>Thursday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Principal's Office</td>
                        </tr>
                        <tr>
                            <td>Friday</td>
                            <td>8:00 AM – 3:00 PM</td>
                            <td>Admin Office</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="col-md-6 bg-light p-4">
                <h1 class="text-center">Contact Us</h1>
                <form>
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your full name">

                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your email">

                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" placeholder="Enter subject">

                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="3" placeholder="Type your message here"></textarea>

                    <button type="submit" class="btn btn-primary w-100 mt-3">Send Message</button>
                </form>
            </div>

        </div>
    </div>

</body>
</html>
